<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PencilWala - Proper Layout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style6.css">
</head>
<body>

    <div class="top-strip">
        <div class="container">
            <div class="lang-switcher">
                English <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </div>

    <header class="main-header">
        <div class="container header-grid">
            <div class="search-container">
                <div class="category-dropdown">
                    All Categories <i class="fas fa-chevron-down"></i>
                </div>
                <input type="text" placeholder="Search for Products...">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>

            <div class="logo">
                <img src="pencil.jpg" alt="PencilWala">
            </div>

            <div class="header-actions">
                <div class="action-box">
                    <div class="icon-circle"><i class="far fa-user"></i></div>
                    <div class="action-text">
                        <span>Sign In</span>
                        <strong>Account</strong>
                    </div>
                </div>
                <div class="action-box">
                    <div class="icon-circle">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="badge">0</span>
                    </div>
                    <div class="action-text">
                        <span>₹0.00</span>
                        <strong>Total</strong>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="container nav-flex">
            <div class="location">
                <i class="fas fa-map-marker-alt"></i> Find Store Location
            </div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="phone-box">
                <i class="fas fa-phone-alt"></i> +91 9928637362
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container hero-grid">
            <div class="hero-text">
                <h1 class="hero-title">Super <br> Stationary Store</h1>
                
                <div class="desc-with-img">
                    <img src="banner.jpg" alt="Office" class="small-desc-img">
                    <p>Notebooks, pens, sticky notes, folders, desks, organizers and planners</p>
                </div>

                <div class="hero-btns">
                    <a href="#" class="btn-explore">Explore Now <i class="fas fa-arrow-right"></i></a>
                    <a href="#" class="btn-browse">Browse All</a>
                </div>
            </div>

            <div class="hero-image-container">
                <img src="banner2.jpg" alt="Back to school" class="main-banner-img">
            </div>
        </div>
    </section>

</body>
</html>

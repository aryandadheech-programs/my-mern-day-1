<html>
<head>
<title>Calculator</title>
<link rel="stylesheet" href="stylecal.css">
<script src="scriptcal.js"></script>
</head>
<body>

<div class="calculator">
    
    <input type="text" class="display" placeholder="0">

    <div class="buttons">
        <button>C</button>
        <button>%</button>
        <button>/</button>
        <button>*</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>-</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>+</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>=</button>

        <button class="zero">0</button>
        <button>.</button>
    </div>

</div>


</body>
</html>
